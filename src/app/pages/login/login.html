<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Login to continue your mystery game adventure</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          [(ngModel)]="formData.email"
          required
          placeholder="Enter your email"
          [class.error]="errors?.email">
        <span class="error-message" *ngIf="errors?.email">{{ errors?.email }}</span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          [(ngModel)]="formData.password"
          required
          placeholder="Enter your password"
          [class.error]="errors?.password">
        <span class="error-message" *ngIf="errors?.password">{{ errors?.password }}</span>
      </div>

        <!-- <div class="error-message general-error" *ngIf="errors?.general">
            {{ errors?.general }} -->
      <!-- </div> -->

      <div class="form-actions">
        <button 
          type="submit" 
          class="login-btn"
          [disabled]="isLoading || !loginForm.valid">
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading">⏳ Logging in...</span>
        </button>
      </div>

      <div class="success-message" *ngIf="successMessage">
        ✓ {{ successMessage }}
      </div>

      <div class="form-footer">
        <p>Don't have an account? <a routerLink="/register">Register here</a></p>
      </div>
    </form>
  </div>
</div>
